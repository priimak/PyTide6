[project]
name = "pytide6"
description = "Sidekick library to PySide6 making it easier and more compact to use and providing set of higher level functions."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.9",
    "sprats @ git+https://github.com/priimak/sprats.git@v0.5.0"
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]